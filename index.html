<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4MB4</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>M4MB4</h1>

        <p>NEW MUSIC. NEW SHOW. NEW ERA.</p>

        <div class="links">
            <button onclick="openMerch()">MERCH</button>
        </div>
    </main>

    <div id="merch" class="merch">
        
        <button class="close" onclick="closeMerch()">×</button>

        <div class="product">
            <img
                src="assets/unisex-classic-hoodie-black-front.png"
                alt="M4MB4 Black Hoodie"
            >

            <h2>M4MB4 HOODIE</h2>
            <p>BLACK / WHITE</p>

            <button class="coming-soon">COMING SOON</button>
        </div>

    </div>

    <script>
        function openMerch() {
            document.getElementById("merch").classList.add("active");
        }

        function closeMerch() {
            document.getElementById("merch").classList.remove("active");
        }
    </script>

</body>
</html>
